  <circle cx="364" cy="48" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="596" cy="48" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="828" cy="48" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

