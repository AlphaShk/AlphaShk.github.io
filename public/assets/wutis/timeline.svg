<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-labelledby="wutis-tl-title wutis-tl-desc" font-family="Inter, system-ui, sans-serif">
  <title id="wutis-tl-title">WUTIS roles and projects, winter 2024/25 to summer 2026</title>
  <desc id="wutis-tl-desc">A timeline of four semesters in the WUTIS Algorithmic Trading division. Winter 2024/25: Fellow Analyst, member of a four-person team building Ornstein-Uhlenbeck pairs trading with a likelihood fit, cost-aware entry and exit bands and an Alpaca streaming prototype. Summer 2025: Analyst / Project Lead of a three-person team forecasting volatility with a Keras CNN and GRU network, Optuna tuning, a trading-window search and a backtrader backtest; plus an internal coding workshop in March 2025. Winter 2025/26: Associate / Project Lead of a five-person team in which Qiskit quantum-neural-network forecasts feed a long-only Markowitz optimizer with weekly rebalancing. Summer 2026: Senior Associate, Workshop Leader and Recruiter, with two workshops in March 2026 (advanced coding; Docker and Google Cloud) and a fellowship assignment.</desc>
  <defs>
    <marker id="wutis-tl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

