 <title>Expected best t-statistic among N strategies with no edge</title>
 <desc>The expected maximum of N standard-normal test statistics rises with the number of variants tried: about 0.5 at N = 2, 1.6 at 10, 2.5 at 100, 3.3 at 1,000 and 3.43 at the program's 1,871 counted trials, well above the usual single-test pass mark of t = 2.</desc>
