 <title>Lifetimes of large bid-side placements</title>
 <desc>Histogram of the lifetimes of 1,290 large bid-side placements from the 14-hour capture, in bins of about 0.6 seconds. 846 placements (66%) were gone within 0.7 seconds, 190 within 0.7 to 1.3 seconds and 71 within 1.3 to 1.9 seconds; the counts then fall below 40 per bin. 45 placements that lasted 6 to 18 seconds are not drawn.</desc>
