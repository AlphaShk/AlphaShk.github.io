<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="erste-pipe-title erste-pipe-desc" font-family="Inter, system-ui, sans-serif">
  <title id="erste-pipe-title">AI-assisted modernization pipeline</title>
  <desc id="erste-pipe-desc">Four steps from left to right: legacy code, AI-assisted analysis, automated quality checks with human review, and the outputs: documentation and modern integration code delivered as pull requests.</desc>
  <rect width="960" height="220" fill="#ffffff"/>
  <g stroke="#1f2937" stroke-width="1.5" fill="#f8fafc">
    <rect x="16" y="70" width="190" height="80" rx="8"/>
    <rect x="262" y="70" width="190" height="80" rx="8"/>
    <rect x="508" y="70" width="190" height="80" rx="8"/>
    <rect x="754" y="70" width="190" height="80" rx="8" stroke="#2563eb"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="111" y="106">Legacy mainframe code</text>
    <text x="357" y="106">AI-assisted analysis</text>
    <text x="603" y="106">Quality checks</text>
    <text x="849" y="106">Docs + modern code</text>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="111" y="126">Natural/Adabas</text>
    <text x="357" y="126">agents map and explain it</text>
    <text x="603" y="126">tests, checks, human review</text>
    <text x="849" y="126">Java/OSB, as pull requests</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5" fill="#2563eb">
    <path d="M206 110 H254" fill="none"/><path d="M262 110 l-9 -5 v10 z"/>
    <path d="M452 110 H500" fill="none"/><path d="M508 110 l-9 -5 v10 z"/>
    <path d="M698 110 H746" fill="none"/><path d="M754 110 l-9 -5 v10 z"/>
  </g>
  <text x="480" y="190" font-size="12" fill="#2563eb" text-anchor="middle">typical use-case cycle time: months → under one work week</text>
</svg>
