<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="mdp-arch-title mdp-arch-desc" font-family="Inter, system-ui, sans-serif">
  <title id="mdp-arch-title">Market-data platform: high-level data flow</title>
  <desc id="mdp-arch-desc">Crypto exchanges, with order books from 31 venues, feed Rust collectors that hold 33 exchange integrations; I implemented 19 of them and the shared normalization layer. The collectors publish normalized events on a NATS message bus. Go services, a gateway and an engine, consume the events and read and write three stores: ClickHouse (analytical), PostgreSQL (relational) and Redis (in-memory). A Node API, which is also the platform's control plane, sits between the Go services and the web clients, which are built with React and TypeScript. Blue text marks my part of the collector layer.</desc>
  <defs>
    <marker id="mdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="324" fill="#ffffff"/>

  <!-- Row 1: data path, left to right. Arrows are neutral on this diagram: blue marks only my part. -->
  <rect x="24" y="32" width="148" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="98" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Crypto exchanges</text>
  <text x="98" y="95" text-anchor="middle" font-size="12" fill="#64748b">order books</text>
  <text x="98" y="113" text-anchor="middle" font-size="12" fill="#64748b">from 31 venues</text>

  <line x1="172" y1="88" x2="198" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#mdp-arrow)"/>

  <rect x="200" y="32" width="184" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="292" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Rust collectors</text>
  <text x="292" y="88" text-anchor="middle" font-size="12" fill="#64748b">33 exchange integrations</text>
  <text x="292" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">19 implemented by me</text>
  <text x="292" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">+ shared normalization</text>

  <line x1="384" y1="88" x2="410" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#mdp-arrow)"/>

  <rect x="412" y="32" width="136" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">NATS</text>
  <text x="480" y="95" text-anchor="middle" font-size="12" fill="#64748b">message bus</text>
  <text x="480" y="113" text-anchor="middle" font-size="12" fill="#64748b">normalized events</text>

  <line x1="548" y1="88" x2="574" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#mdp-arrow)"/>

  <rect x="576" y="32" width="160" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="656" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Go services</text>
  <text x="656" y="95" text-anchor="middle" font-size="12" fill="#64748b">gateway</text>
  <text x="656" y="113" text-anchor="middle" font-size="12" fill="#64748b">engine</text>

  <line x1="736" y1="88" x2="762" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#mdp-arrow)"/>

  <rect x="764" y="32" width="172" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="850" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Node API</text>
  <text x="850" y="103" text-anchor="middle" font-size="12" fill="#64748b">control plane</text>

  <!-- Go services read and write the stores -->
  <line x1="656" y1="146" x2="656" y2="198" stroke="#64748b" stroke-width="2" marker-start="url(#mdp-arrow)" marker-end="url(#mdp-arrow)"/>

  <!-- The Node API sits in front of the web clients -->
  <line x1="850" y1="146" x2="850" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#mdp-arrow)"/>

  <!-- Row 2: stores and web clients -->
  <rect x="556" y="200" width="200" height="100" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="576" y="229" font-size="14" font-weight="600" fill="#1f2937">ClickHouse</text>
  <text x="736" y="229" text-anchor="end" font-size="12" fill="#64748b">analytical</text>
  <text x="576" y="255" font-size="14" font-weight="600" fill="#1f2937">PostgreSQL</text>
  <text x="736" y="255" text-anchor="end" font-size="12" fill="#64748b">relational</text>
  <text x="576" y="281" font-size="14" font-weight="600" fill="#1f2937">Redis</text>
  <text x="736" y="281" text-anchor="end" font-size="12" fill="#64748b">in-memory</text>

  <rect x="782" y="200" width="136" height="100" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="850" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Web clients</text>
  <text x="850" y="266" text-anchor="middle" font-size="12" fill="#64748b">React / TypeScript</text>

  <!-- Legend -->
  <text x="24" y="256" font-size="12" fill="#64748b"><tspan fill="#2563eb" font-weight="600">Blue text</tspan> marks my part of the collector layer.</text>
</svg>
