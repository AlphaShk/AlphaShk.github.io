<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="576pt" height="288pt" viewBox="0 0 576 288" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img">
 <title>Wider passive quotes: a gain under lenient matching, none under strict matching</title>
 <desc>Grouped columns of six-day local backtest PnL for the ASH market maker in XIRECs, Round-2 v1 (gray) versus the Round-2 final candidate with wider passive quotes (blue). Lenient matching: 66,130 versus 99,620, a gain of 33,490. Strict matching: 17,947 for both, no change. PEPPER PnL was identical for both versions, so total six-day PnL moved from 548,154 to 581,644 (plus 6.1 percent) under lenient matching and stayed at 490,715 under strict matching.</desc>
