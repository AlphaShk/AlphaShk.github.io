 <title>Modelled LLM cost of one full cold-start verification pass</title>
 <desc>Cost model output of 19 October 2026 for verifying an estimated 340,215 pairs once. Each range runs from the base token estimate to 1.3 times it; tick marks show both ends of each range. Small model only (Claude Haiku 5.5, thinking off): $120 to $156 standard, $49 to $64 with batch and caching; Haiku triage on every pair + Sonnet on 10% of pairs: $302 to $393 standard, $130 to $169 with batch and caching; Haiku triage on every pair + Sonnet on 30% of pairs: $781 to $1,015 standard, $328 to $426 with batch and caching; Larger model only (Claude Sonnet 5.5): $2,393 to $3,110 standard, $987 to $1,283 with batch and caching. Modelled, not billed.</desc>
